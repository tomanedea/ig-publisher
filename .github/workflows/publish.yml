name: publish

on:
  schedule:
    - cron: "7 * * * *"   # hourly; GitHub often starts these hours late, so each run loops ~5.6 h
  workflow_dispatch:
    inputs:
      only:
        description: "Publish just this key now (testing)"
        required: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Publish due items
        env:
          IG_TOKENS: ${{ secrets.IG_TOKENS }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python3 publish.py --only=${{ github.event.inputs.only }}
          else
            git config user.name "publisher-bot"
            git config user.email "publisher-bot@users.noreply.github.com"
            python3 publish.py --loop=335
          fi
      - name: Save state
        run: |
          git config user.name "publisher-bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
